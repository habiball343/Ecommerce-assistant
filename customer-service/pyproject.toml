[project]
name = "customer-service"
version = "1.0.0"
description = "电商小二 · 客服服务：会话、消息、连续提问合并、人工工单与实时推送"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2.9",
    "pydantic-settings>=2.10.1",
    "pyjwt>=2.10.1",
    "redis>=6.2.0",
    "sqlalchemy[asyncio]>=2.0.41",
    "uvicorn[standard]>=0.35.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"
